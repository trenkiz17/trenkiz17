
name: Gerar cobrinha

on:
  workflow_dispatch:
  push:
    branches: [main]
  schedule:
    - cron: "0 6 * * *"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Gerar animacao
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: trenkiz17
          outputs: |
            dist/github-contribution-grid-snake.svg?palette=github-light&color_snake=magenta
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=magenta

      - name: Publicar cobrinha
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
